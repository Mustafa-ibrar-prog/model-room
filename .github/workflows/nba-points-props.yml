name: NBA player points lines (TEST)

# BACKUP trigger for the NBA player points lines (Moose, 2026-11-25). The primary trigger is the Supabase scheduler,
# which wakes the Preview workflow at 5:30 AM PT (main) and 9:30 AM PT (retry of empty games only); it sends only the
# wake-up, and nothing is stored in Supabase. These GitHub schedules fire at both the standard-time and daylight-time
# UTC equivalents; a scheduled run proceeds only inside the Pacific window (main 5:30-8:30, retry 9:30-12:30) and only
# if that mode hasn't already run today (write-once R2 lock + attempt markers), so a duplicate trigger never pays
# twice. Credit cap: 12 a day held back for game lines (today included) + 30, spread over the cycle, max 15 a day
# (modeling/modelroom/sources/odds_props.py). Logs show counts only: no lines, prices, sportsbook names or players.
on:
  schedule:
    # From 2026-11-28 (Moose 2026-11-27): backups for the three full refreshes' prop-line checks (today AND tomorrow),
    # 40 minutes after each slot; only inside the Pacific window, and a slot already done is skipped.
    - cron: "40 14 * * *"   # 7:40 AM PDT
    - cron: "40 15 * * *"   # 7:40 AM PST
    - cron: "40 19 * * *"   # 12:40 PM PDT
    - cron: "40 20 * * *"   # 12:40 PM PST
    - cron: "40 23 * * *"   # 4:40 PM PDT
    - cron: "40 0 * * *"    # 4:40 PM PST
  workflow_dispatch:
    inputs:
      mode:
        description: "morning | midday | afternoon (today AND tomorrow, games not yet captured); main | followup are the retired 5:30 / 9:30 modes"
        default: morning
        type: choice
        options: [morning, midday, afternoon, main, followup]

permissions:
  contents: read
  issues: write

concurrency:
  group: nba-points-props
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modeling
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_API_CYCLE_DAY: ${{ vars.ODDS_API_CYCLE_DAY || '10' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
      R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e . boto3
      - name: Today's board from the preview branch
        working-directory: .
        run: |
          git fetch -q --depth 1 origin preview
          mkdir -p /tmp/pv
          git show FETCH_HEAD:modeling/data/published/nba_props.json > /tmp/pv/nba_props.json
          git show FETCH_HEAD:modeling/data/published/nfl_props.json > /tmp/pv/nfl_props.json || rm -f /tmp/pv/nfl_props.json
      - name: Fetch and store (counts only in the log)
        run: |
          mode="${{ github.event.inputs.mode || '' }}"; win=""
          if [ -z "$mode" ]; then
            case "${{ github.event.schedule }}" in "40 14 * * *"|"40 15 * * *") mode=morning;; "40 19 * * *"|"40 20 * * *") mode=midday;; *) mode=afternoon;; esac
            win="--only-in-window"
          fi
          rc=0; python -m modelroom.sources.odds_props fetch --mode "$mode" $win --board /tmp/pv/nba_props.json --nfl-board /tmp/pv/nfl_props.json > /tmp/out.json || rc=$?
          python3 -c "import json; d=json.load(open('/tmp/out.json')); print(json.dumps(d, indent=1))"
          exit $rc
      - name: Verify today's snapshots with the read-only token
        run: |
          python -m modelroom.sources.odds_props verify > /tmp/verify.json; rc=$?
          cat /tmp/verify.json; exit $rc
      - name: Open an issue on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --state open --search "NBA player points lines failed in:title" --json number -q '.[0].number')
          body="The NBA player points run failed or stopped (credit cap, provider or storage problem): $url"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "NBA player points lines failed" --body "$body"; fi
