name: Injury probe
on: { push: { branches: [injury-probe] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out && git commit -qm "Probe output" && git push
