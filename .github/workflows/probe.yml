name: Injury probe
on: { push: { branches: [injury-probe] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pdfplumber pandas pyarrow
      - run: THREADS=3 TARGETS=targets3.csv OUT=hist3 python3 harvest.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add hist3 && git commit -qm "Historical NBA injury reports (parsed)" && git push
