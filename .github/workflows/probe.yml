name: Injury probe
on: { push: { branches: [injury-probe] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 savant.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add savant && git commit -qm "NFL Savant site snapshot (research)" && git push
