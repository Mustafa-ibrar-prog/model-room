name: Parlay Builder site check (TEST, manual, read-only)

# One-off verification branch (Moose 2026-11-27): after the Preview redeploy, confirm the TEST server sees
# GEMINI_API_KEY and MODELROOM_PRIVATE_VIEW_KEY without printing either, and make ONE Gemini request through
# "Analyze My Parlay". Prints statuses and counts only.
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://model-room-git-preview-computer-citi.vercel.app
      SHA: 2518b01a
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the Preview redeploy
        run: |
          full=$(gh api repos/${{ github.repository }}/commits/$SHA -q .sha)
          for i in $(seq 1 60); do
            state=$(gh api repos/${{ github.repository }}/commits/$full/status -q '[.statuses[] | select(.context=="Vercel")][0].state // "none"')
            echo "Vercel: $state"; [ "$state" = success ] && exit 0
            { [ "$state" = failure ] || [ "$state" = error ]; } && { echo "::error::Vercel deploy failed"; exit 1; }
            sleep 15
          done
          exit 1
      - name: Check variables and Gemini (statuses only)
        run: |
          sleep 20
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          site = os.environ["SITE"]
          def req(path, body=None, method=None):
              r = urllib.request.Request(site + path, data=None if body is None else json.dumps(body).encode(), method=method,
                                         headers={"content-type": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=60) as x:
                      return x.status, x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
          s, page = req("/parlay")
          print("page HTTP", s)
          print("GEMINI_API_KEY read by the TEST server (AI switched on):", "it isn" not in page)
          print("MODELROOM_PRIVATE_VIEW_KEY read by the TEST server (unlock form shown):", "Private view (live Polymarket prices)" in page)
          s, b = req("/api/parlay/unlock", {"key": "definitely-not-the-key-000"}, "POST")
          print("unlock with a wrong key -> HTTP", s, "(403 = key configured and rejected; 404 = not configured)")
          for marker in ("AIza", "x-goog-api-key", "MODELROOM_PRIVATE_VIEW_KEY", "GEMINI_API_KEY"):
              print(f"secret marker {marker!r} in page or unlock reply:", marker in page or marker in b)
          s, g = req("/api/parlay/games?league=nba")
          games = [x for x in json.loads(g)["games"] if x["lines"]]
          s, l = req(f"/api/parlay/legs?league=nba&game={games[0]['gameId']}")
          leg = [x["id"] for x in json.loads(l)["legs"] if x["kind"] == "moneyline"][:1]
          s, a = req("/api/parlay/analyze", {"legs": leg}, "POST")
          d = json.loads(a)
          ai = d.get("ai", {})
          print("analyze HTTP", s, "| numbers ok:", d.get("price", {}).get("ok"), "| AI status:", ai.get("status"), "| reason:", ai.get("reason"),
                "| model:", ai.get("model"), "| cached:", ai.get("cached"))
          if ai.get("status") == "ok":
              t = ai["text"]
              print("AI text: summary chars", len(t.get("summary", "")), "| leg notes", len(t.get("legs", [])), "| sentences removed by validator", t.get("removed"))
          else:
              print("AI message:", ai.get("message"))
          PY
