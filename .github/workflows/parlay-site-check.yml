name: Parlay Builder site check (TEST, manual, read-only)

# Loads the TEST Parlay Builder page and its read-only APIs (Moose, 2026-11-27). Prints counts and yes/no checks only:
# no lines, prices, sportsbook names or player-line pairs. Does not call Analyze (no Gemini request).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://model-room-git-preview-computer-citi.vercel.app
    steps:
      - name: Page and APIs
        run: |
          curl -sS -L --max-time 60 -o /tmp/page.html -w "page HTTP %{http_code}\n" "$SITE/parlay"
          for lg in nba nfl; do curl -sS --max-time 60 -o /tmp/games_$lg.json -w "games $lg HTTP %{http_code}\n" "$SITE/api/parlay/games?league=$lg"; done
          python3 - <<'PY'
          import json, re, urllib.request, os
          site = os.environ["SITE"]
          page = open("/tmp/page.html", encoding="utf-8", errors="replace").read()
          print("page has builder heading:", "Build a parlay" in page)
          print("GEMINI_API_KEY visible to the TEST server (AI switched on):", "isn't switched on yet" not in page and "it isn" not in page)
          print("private view key configured (unlock form shown):", "Private view (live Polymarket prices)" in page)
          for s in ("GEMINI", "AIza", "generativelanguage", "x-goog-api-key", "R2_", "r2.cloudflarestorage.com"):
              print(f"secret marker {s!r} in page:", s in page)
          ids = []
          for lg in ("nba", "nfl"):
              g = json.load(open(f"/tmp/games_{lg}.json"))["games"]
              withlegs = [x for x in g if x["props"] or x["lines"]]
              print(f"{lg}: games {len(g)}, with legs {len(withlegs)}")
              tot = {"games": 0, "game_lines": 0, "game_lines_priced": 0, "game_lines_with_books": 0, "book_props": 0, "book_props_priced": 0, "model_props": 0, "props_with_last10": 0, "no_price_text": 0, "max_books": 0}
              for x in withlegs[:16]:
                  legs = json.load(urllib.request.urlopen(f"{site}/api/parlay/legs?league={lg}&game={x['gameId']}"))["legs"]
                  tot["games"] += 1
                  for l in legs:
                      if l["kind"] != "prop":
                          tot["game_lines"] += 1; tot["game_lines_priced"] += bool(l["price"]); tot["game_lines_with_books"] += bool(l.get("quotes"))
                      elif l["source"] == "book_line":
                          tot["book_props"] += 1; tot["book_props_priced"] += bool(l["price"])
                      else:
                          tot["model_props"] += 1
                      if l["kind"] == "prop": tot["props_with_last10"] += bool(l.get("last10"))
                      if not l["price"]: tot["no_price_text"] += bool(l.get("noPrice"))
                      tot["max_books"] = max(tot["max_books"], len(l.get("quotes") or []))
                      if l["source"] == "model_line" and l["price"]: print("PROBLEM: a model line carries a price")
                      tot["polymarket_quotes"] = tot.get("polymarket_quotes", 0) + bool(l.get("polymarket"))   # live on TEST by Moose's choice (2026-11-27)
                  if len(ids) < 6:
                      ids += [l["id"] for l in legs if l["kind"] != "prop"][:1] + [l["id"] for l in legs if l["kind"] == "prop"][:1]
              print(f"{lg} (first {tot['games']} games):", json.dumps(tot))
          req = urllib.request.Request(f"{site}/api/parlay/price", data=json.dumps({"legs": ids}).encode(), headers={"content-type": "application/json"})
          p = json.load(urllib.request.urlopen(req))
          print("price ok:", p["ok"], "| legs", len(p["legs"]), "| single number:", p["p"] is not None, "| range present:", p["range"] is not None, "| warnings", len(p["warnings"]))
          pk = json.load(urllib.request.urlopen(f"{site}/api/parlay/picks"))
          print("picks:", len(pk["picks"]), "| history note present:", pk["history"] is not None)
          PY
      - name: Explorer cards (one per player per stat; selections match the server's legs)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          site = os.environ["SITE"]
          get = lambda u: json.load(urllib.request.urlopen(site + u, timeout=60))
          def grid_at(g, k):
              i = (k - g["k0"]) / g["step"]
              return g["p"][round(i)] if abs(i - round(i)) < 1e-9 and 0 <= round(i) < len(g["p"]) else None
          problems = 0
          for lg in ("nba", "nfl"):
              games = [x for x in get(f"/api/parlay/games?league={lg}")["games"] if x["props"] or x["lines"]][:8]
              t = {"games": len(games), "prop_cards": 0, "duplicate_cards": 0, "markets": set(), "cards_with_books": 0, "cards_with_polymarket": 0,
                   "thresholds": 0, "game_cards": 0, "game_lines_offered": 0, "checked": 0, "mismatch": 0, "book_checked": 0, "pm_checked": 0}
              for x in games:
                  d = get(f"/api/parlay/legs?league={lg}&game={x['gameId']}")
                  cp, cg = d["cards"]["props"], d["cards"]["games"]
                  keys = [c["key"] for c in cp]
                  t["prop_cards"] += len(cp); t["duplicate_cards"] += len(keys) - len(set(keys)); t["markets"] |= {c["market"] for c in cp}
                  t["cards_with_books"] += sum(bool(c["quotes"]) for c in cp); t["cards_with_polymarket"] += sum(bool(c["pm"]) for c in cp)
                  t["thresholds"] += sum(len(c["thresholds"]) for c in cp)
                  t["game_cards"] += len(cg); t["game_lines_offered"] += sum(len(c["lines"]) for c in cg)
                  seen = set()
                  for c in cp:
                      pick = []
                      if c["market"] not in seen: pick.append(c["thresholds"][len(c["thresholds"]) // 2]); seen.add(c["market"])
                      if c["bookLine"] is not None: pick.append(c["bookLine"] + 0.5)
                      pick += [q["line"] for q in c["pm"]][:1]
                      for K in pick:
                          if K not in c["thresholds"]: continue
                          for sd in ("o", "u"):
                              base = f"{lg}~{c['gameId']}~prop~{c['playerId']}~{c['market']}"
                              cand = ([f"{base}~b{c['bookLine']}~{sd}"] if c["bookLine"] is not None and c["bookLine"] + 0.5 == K else []) + ([f"{base}~p{K}~{sd}"] if any(q["line"] == K for q in c["pm"]) else []) + [f"{base}~m{K}~{sd}"]
                              lid = next((i for i in cand if i in c["legIds"]), cand[-1])
                              try: leg = get(f"/api/parlay/legs?league={lg}&id={urllib.parse.quote(lid)}")["leg"]
                              except Exception: continue
                              gp = grid_at(c["grid"], K)
                              want = gp if sd == "o" else 1 - gp
                              t["checked"] += 1
                              ok = abs(leg["p"] - want) < 2e-4
                              if "~b" in lid:
                                  t["book_checked"] += 1
                                  exact = [q for q in c["quotes"] if q["line"] == K - 0.5 and q["over" if sd == "o" else "under"] is not None]
                                  ok = ok and bool(leg["price"]) == bool(exact)
                              q = next((q for q in c["pm"] if q["line"] == K), None)
                              if q:
                                  t["pm_checked"] += 1
                                  ok = ok and bool(leg.get("polymarket"))
                              elif leg.get("polymarket"): ok = False
                              if leg["source"] == "model_line" and leg["price"]: ok = False
                              t["mismatch"] += not ok
              problems += t["mismatch"] + t["duplicate_cards"]
              t["markets"] = len(t["markets"])
              print(f"{lg} cards:", json.dumps(t))
              if games:
                  page = urllib.request.urlopen(f"{site}/{lg}-props?game={games[0]['gameId']}", timeout=60).read().decode("utf-8", "replace")
                  print(f"{lg} explorer page: player pickers {page.count('data-card=')}, add-to-parlay buttons {page.count('Add to parlay')}")
          print("PROBLEMS:", problems)
          PY
