name: Props lines site check (TEST, manual, read-only)

# Loads the TEST NBA Props page and one player page and checks that stored sportsbook points lines render
# (Moose, 2026-11-24). Read-only page loads; prints counts and yes/no checks only: no prices, lines or sportsbook names.
on:
  workflow_dispatch:
    inputs:
      game:
        description: "ESPN game id (blank = skip the page check)"
        required: false
        default: ""
      player:
        description: "player id for the detail page"
        required: false
        default: ""
      date:
        description: "snapshot date to verify in R2 (YYYY-MM-DD, Pacific; blank = skip)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://model-room-git-preview-computer-citi.vercel.app
    steps:
      - uses: actions/checkout@v4
        if: github.event.inputs.date != ''
        with:
          fetch-depth: 1
      - name: Verify stored snapshots with the READ-ONLY token (no Odds API call)
        if: github.event.inputs.date != ''
        working-directory: modeling
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
        run: |
          pip install -q -e . boto3
          python -m modelroom.sources.odds_props verify --date "${{ github.event.inputs.date }}"
          python3 - <<'PY'
          import json, os
          from modelroom.archive import market_snapshots as MS
          from modelroom.archive.store import reader_from_env
          r = reader_from_env(); d = "${{ github.event.inputs.date }}"
          latest = MS.read_latest(r, d)
          if latest:
              v = json.loads(r.get(latest["view"]))
              for gid, g in v["games"].items():
                  books = [len(p["books"]) for p in g["players"].values()]
                  print(f"game {gid}: players with a line {len(books)}, unmatched provider players {g['unmatched_players']}, books per player min {min(books) if books else 0} max {max(books) if books else 0}")
              print("objects under the day:", len(r.list(MS.day_prefix(d) + "/")))
          else:
              print("no snapshots stored for", d)
          PY
      - name: Load the pages and count what renders
        if: github.event.inputs.game != ''
        run: |
          curl -sS -L --max-time 60 -o /tmp/list.html -w "list page HTTP %{http_code}\n" "$SITE/nba-props?game=${{ github.event.inputs.game }}&cat=points"
          curl -sS -L --max-time 60 -o /tmp/detail.html -w "detail page HTTP %{http_code}\n" "$SITE/nba-props?game=${{ github.event.inputs.game }}&cat=points&player=${{ github.event.inputs.player }}"
          python3 - <<'EOF'
          import re, html
          def text(f):
              t = re.sub(r"<script.*?</script>", " ", open(f, encoding="utf-8", errors="replace").read(), flags=re.S)
              return re.sub(r"[\u202f\u00a0]", " ", html.unescape(re.sub(r"<[^>]+>", "", t)))
          L, D = text("/tmp/list.html"), text("/tmp/detail.html")
          print("list: 'Sportsbook line' labels:", L.count("Sportsbook line"))
          print("list: cards showing book count/name + update time:", len(re.findall(r"Sportsbook line\s*[\d.]+\s*[^·]{1,40}·\s*\d{1,2}:\d{2} [AP]M PT", L)))
          print("list: cards with 'none':", len(re.findall(r"Sportsbook line\s*none", L)))
          for lab in ("Pending", "Unavailable"):
              print(f"list: cards labelled {lab}:", len(re.findall(r"Sportsbook line\s*" + lab, L)))
          reasons = {}
          for m in re.finditer(r"Sportsbook line\s*(Pending|Unavailable)([^.]{0,90}\.)", L):
              reasons[m.group(1) + ": " + m.group(2).strip()] = reasons.get(m.group(1) + ": " + m.group(2).strip(), 0) + 1
          print("list: label reasons:", reasons)
          print("detail: sportsbook table present:", "Sportsbook lines (points, US books)" in D)
          print("detail: table header present:", all(h in D for h in ("Sportsbook", "Line", "Over", "Under", "Updated")))
          rows = re.findall(r"<tr[^>]*>.*?</tr>", open("/tmp/detail.html", encoding="utf-8", errors="replace").read(), flags=re.S)
          print("detail: table rows (incl. header):", len(rows))
          print("detail: update times shown:", len(re.findall(r"\d{1,2}:\d{2} [AP]M PT", D)) > 0)
          print("detail: responsible-gambling line:", "Gamble responsibly. 18+" in D)
          print("detail: 'more than' headline at a book line:", bool(re.search(r"Chance of more than \d+(\.\d)?", D)))
          for s in ("R2_", "AKIA", "r2.cloudflarestorage.com", "x-amz", "Signature="):
              print(f"credential marker '{s}' in page:", s in open("/tmp/list.html").read() or s in open("/tmp/detail.html").read())
          EOF
