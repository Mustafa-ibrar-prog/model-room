# Refreshes the private Vercel preview with real data every morning.
#
# Runs on main (GitHub only schedules workflows from the default branch) but
# only ever pushes to the `preview` branch. main's code and ledger are never
# modified. If data validation fails, nothing is published and the site keeps
# showing the previous projections as "Delayed".
name: Refresh preview data

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC = 5:17 AM PST / 6:17 AM PDT
  workflow_dispatch: {}     # "Run workflow" button in the GitHub app

permissions:
  contents: write

concurrency:
  group: preview-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODELROOM_LEDGER_DIR: ${{ github.workspace }}/modeling/preview-ledger
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the preview branch and bring in the latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin preview >/dev/null; then
            git fetch origin preview
            git checkout -B preview origin/preview
            git merge --no-edit origin/main
          else
            git checkout -B preview
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the engines
        run: pip install -e modeling

      - name: Download and validate data
        working-directory: modeling
        run: |
          python -m modelroom nba ingest
          python -m modelroom nfl ingest
          python -m modelroom sources validate

      - name: Generate projections
        working-directory: modeling
        run: |
          python -m modelroom nba project
          python -m modelroom nfl project
          python -m modelroom nfl props
          python -m modelroom nba props
          python -m modelroom ledger verify
        # No exchange prices here on purpose: this repository is public, and Polymarket US / Kalshi
        # terms don't allow republishing their data. Market comparison runs on your own machine.

      - name: Publish to the preview branch
        run: |
          git add -f modeling/data/published/nba.json modeling/data/published/nfl.json modeling/data/published/nfl_props.json modeling/data/published/nba_props.json modeling/preview-ledger
          git commit -m "Preview data refresh $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes to publish"
          git push origin preview
