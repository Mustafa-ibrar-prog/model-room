# Continuous deployment of the public test site (the `preview` branch on Vercel).
#
#   push to main      → main is merged into `preview` within about a minute; Vercel rebuilds the test site.
#                       If the push changed modeling/ (engines, params), projections are regenerated first.
#   twice a day       → fresh data: download, validate, run every engine, publish.
#   "Run workflow"    → same as the scheduled run (GitHub app: Actions → Preview → Run workflow).
#
# Only `preview` is ever pushed to. main is never modified, and production is not deployed from here.
# No exchange prices are fetched: this repository is public, and Polymarket US / Kalshi terms don't
# allow republishing their data. No secrets are used.
name: Preview

on:
  push:
    branches: [main]
  schedule:
    # Backup trigger only, every 6 hours, in case Supabase stops dispatching. The primary trigger is Supabase,
    # which now wakes this workflow only when a refresh slot is actually due: pg_cron checks the stored wake time
    # inside Postgres every 5 minutes, for free, and dispatches when it has arrived
    # (supabase/migrations/20261113000100_scheduler_wake.sql). Before, it dispatched every 5 minutes regardless,
    # and about 96% of the runs found nothing to do.
    # Both triggers go through the same planner (modeling/modelroom/refresh_plan.py): 7:00 AM, 12:00 PM and
    # 4:00 PM PT, NFL kickoff − 90 min (inactive lists), and 30 min before every game. Each slot stays open for a
    # window, so a late start still refreshes, and a slot that succeeded is never run twice.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "force = refresh now; plan = refresh only if a slot is due (what the scheduler sends)"
        required: false
        default: force
        type: choice
        options: [force, plan]
      trigger:
        description: "who started the run (logged)"
        required: false
        default: manual
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
      slots: ${{ steps.due.outputs.slots }}
      kinds: ${{ steps.due.outputs.kinds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
          sparse-checkout: |
            modeling/modelroom/refresh_plan.py
            modeling/modelroom/__init__.py
            modeling/preview-ledger/refresh_log.jsonl
            modeling/data/published/nba.json
            modeling/data/published/nfl.json
            scripts/scheduler-next.sh
            scripts/odds-store-connect.sh
            scripts/pooler-url.py
      - name: Is a refresh due?
        id: due
        working-directory: modeling
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$MODE" = "plan" ]; then
            python3 modelroom/refresh_plan.py due
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "slots=" >> "$GITHUB_OUTPUT"; echo "kinds=$EVENT" >> "$GITHUB_OUTPUT"
          fi

      # Nothing is due, so no refresh job will run and report back: say when to ask again, or the scheduler would
      # only have its 15-minute lease to go on and would keep waking up. When a refresh IS due the deploy job does
      # this at the end instead, so that a run which dies without reporting still counts towards the back-off.
      - name: Tell the scheduler when to wake next
        if: steps.due.outputs.run != 'yes'
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          bash scripts/odds-store-connect.sh || true
          bash scripts/scheduler-next.sh

  deploy:
    needs: plan
    if: needs.plan.outputs.run == 'yes'
    concurrency:
      group: preview
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODELROOM_LEDGER_DIR: ${{ github.workspace }}/modeling/preview-ledger
      # Private R2 archive (TEST, 2026-11-23): closed odds.snapshots segments are read from R2 and only newer rows from
      # Supabase. Inactive until the R2_* secrets exist; any archive problem falls back to the full Supabase read.
      MODELROOM_ARCHIVE_READ: "on"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # NBA player props: the 0.2.0 model on the TEST SITE only (approved 2026-11-03). Every prediction it
      # makes is recorded in the ledger as 0.2.0; earlier 0.1.0 records stay exactly as they were.
      # Rollback: delete this line (or set "0.1.0") and push; the next refresh publishes 0.1.0 again.
      MODELROOM_NBA_PROPS_VERSION: "0.2.0"
      # Injury-feed versions on the TEST SITE only. The previous versions keep running in the ledger as shadows
      # (recorded, not published) so both are graded on the same games. Rollback: set the versions back to
      # 0.2.0 / 0.1.0 (and MODELROOM_NBA_INJURY_FEED: "off" for the NBA game engine's injury adjustment).
      # NBA shadow evaluation (approved 2026-11-07, 2-3 weeks): 0.2.3a (primary) and 0.2.3 (secondary) are run on the
      # same games and the same pregame information as the active 0.2.0 and recorded in the ledger; nothing they
      # produce is published. 0.2.1's earlier shadow records stay in the ledger as they were. Graded daily by
      # `nba props-shadow` → preview-ledger/reports/nba_props_shadow.json. Rollback: set back to "0.2.1" (or "").
      # 0.2.3b (approved 2026-11-17): 0.2.3a + minutes fix from pre-game facts only (no lineups: ESPN's starters never
      # arrived before the -30 min refresh, Nov 8-20). Shadow-only, own ledger files, never published. Rollback: drop ",0.2.3b".
      MODELROOM_NBA_PROPS_SHADOW: "0.2.3a,0.2.3,0.2.3b,0.2.3c,0.2.4"
      MODELROOM_NFL_PROPS_VERSION: "0.1.1"
      # NFL shadow test (approved 2026-11-09): 0.1.3 = 0.1.1 + RB-carry / TE-target concentration within each team's
      # position group (team totals unchanged). Recorded in the ledger next to 0.1.1 on the same games and inputs, never
      # published; 0.1.3 can't be made the active version (pipeline refuses). Rollback: remove ",0.1.3".
      # Shadow test (approved 2026-11-17): 0.1.4 = 0.1.1 without FTN charting or participation data (licensing-clean);
      # 0.1.5 = 0.1.4 + touchdown rates scaled by projected team points (fitted 2021-23). Both are shadow-only: recorded
      # on 0.1.1's player-games, never published. Rollback: remove ",0.1.4,0.1.5".
      # Shadow test (approved 2026-11-18): 0.1.6a = 0.1.5 with calibration refitted on 2021-23 (control); 0.1.6 = 0.1.6a +
      # pregame forecast wind, reduce-only (needs `nfl weather` below). Shadow-only. Rollback: remove ",0.1.6a,0.1.6".
      MODELROOM_NFL_PROPS_SHADOW: "0.1.0,0.1.3,0.1.4,0.1.5,0.1.6a,0.1.6"
      MODELROOM_NBA_INJURY_FEED: "on"
      # NFL coming games: the projected starter (injury report + live depth chart) instead of the schedule field,
      # which only repeats last week's starter. Finished games keep the actual starter. Rollback: "listed".
      MODELROOM_NFL_QB_SOURCE: "live"
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bring main into the preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin preview >/dev/null; then
            git fetch origin preview
            git checkout -B preview origin/preview
            git merge --no-edit origin/main
          else
            git checkout -B preview
          fi

      - name: Decide whether to regenerate projections
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          SLOTS: ${{ needs.plan.outputs.slots }}
        run: |
          # Duplicate-run protection: runs queue on the "preview" concurrency group, so by the time this one starts
          # an earlier run may already have done the same slots. Re-check against the latest refresh log.
          if [ -n "$SLOTS" ]; then
            left=$(cd modeling && python3 modelroom/refresh_plan.py pending --slots "$SLOTS" | python3 -c "import sys,json;print(','.join(json.load(sys.stdin)['pending']))")
            if [ -z "$left" ]; then echo "data=no" >> "$GITHUB_OUTPUT"; echo "Slots already done by an earlier run: $SLOTS"; exit 0; fi
          fi
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$SHA" | grep -q '^modeling/'; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          else
            echo "data=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.data == 'yes'
        with:
          python-version: "3.12"

      - name: Connect to the sportsbook snapshot store (TEST Supabase; nothing printed)
        if: steps.plan.outputs.data == 'yes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/odds-store-connect.sh

      - name: Download, validate and project
        id: data
        if: steps.plan.outputs.data == 'yes'
        continue-on-error: true
        working-directory: modeling
        env:
          KINDS: ${{ needs.plan.outputs.kinds }}
        run: |
          pip install -e . "psycopg[binary]"
          [ -z "${R2_ACCOUNT_ID:-}" ] || pip install -q boto3
          # Each league is downloaded and validated on its own (2026-11-18). A league whose data fails (most often
          # nflverse posting an NFL game's play-by-play a few hours after it ends) is skipped for this refresh: none of
          # its predictions are rebuilt, so the site keeps its last good ones and never shows predictions built on
          # incomplete data. The other league still refreshes. Both failing = the whole refresh fails, as before.
          NBA_OK=1; NFL_OK=1
          for lg in nba nfl; do
            if python -m modelroom $lg ingest && python -m modelroom sources validate $lg > /tmp/validate_$lg.txt 2>&1; then :
            else [ $lg = nba ] && NBA_OK=0 || NFL_OK=0; fi
            cat /tmp/validate_$lg.txt 2>/dev/null || true
          done
          for lg in nba nfl; do
            ok=$([ $lg = nba ] && echo $NBA_OK || echo $NFL_OK)
            why=""; [ "$ok" = 1 ] || why=$(grep -h "FAIL  " /tmp/validate_$lg.txt 2>/dev/null | head -2 | sed 's/^ *FAIL  //' | paste -sd';' - | cut -c1-200)
            echo "${lg}_ok=$ok" >> "$GITHUB_OUTPUT"
            [ "$ok" = 1 ] && echo "${lg}_why=" >> "$GITHUB_OUTPUT" || echo "${lg}_why=${why:-download or validation failed}" >> "$GITHUB_OUTPUT"
            [ "$ok" = 1 ] || echo "::warning::${lg^^} data not ready (${why:-download or validation failed}); ${lg^^} predictions not rebuilt this refresh, the site keeps the last good ones"
          done
          if [ $NBA_OK = 0 ] && [ $NFL_OK = 0 ]; then echo "::error::NBA and NFL data both failed"; exit 1; fi
          run() { lg=$1; shift; if [ "$( [ $lg = nba ] && echo $NBA_OK || echo $NFL_OK)" = 1 ]; then "$@"; else echo "skipped ($lg data not ready): $*"; fi; }
          # Injury feed (test site): the official NBA injury report + ESPN's injury reports (+ nflverse's copy of the
          # NFL report). A failed source is logged on the site; the engines then fall back to their own
          # availability rules. Then the NFL starters are rebuilt with the live depth chart and designations.
          run nba python -m modelroom injuries nba || echo "::warning::NBA injury feed failed; NBA engines use the missed-games rule"
          run nfl python -m modelroom injuries nfl || echo "::warning::NFL injury feed failed; NFL engines use nflverse injury reports"
          run nfl python -m modelroom nfl starters > /dev/null
          # Pregame wind forecasts (NWS GFS MOS via the Iowa Environmental Mesonet mirror; public domain, free, no key) for
          # open-air NFL games in the next 40 h, stored append-only in preview-ledger/nfl_weather_week_*.jsonl. Read only by the
          # 0.1.6 shadow; a failure never fails the refresh (that shadow then keeps its unadjusted projection).
          run nfl python -m modelroom nfl weather > /tmp/nfl_weather.json || echo "::warning::NFL wind forecasts not fetched; the 0.1.6 shadow runs without them"
          # Sportsbook lines (DraftKings, FanDuel and other US books) from The Odds API, only when the
          # ODDS_API_KEY secret is set. Free tier = 500 credits a month; each league costs 3 credits a call, so
          # lines are fetched only at the 7:00 AM and 12:00 PM PT refreshes (and manual runs): about 360 a month.
          # The 4:00 PM injury refresh reuses the midday prices (a third fetch would exceed the free 500).
          # Snapshots are kept in the append-only Supabase table odds.snapshots, NOT in this public repository (The Odds
          # API's terms allow storing and displaying the data, not offering it as downloadable files). Each refresh rebuilds
          # the working copy from the table, fetches (7 AM / noon only), and appends new rows; nothing is ever updated.
          # Each row keeps the book, market, line, prices, the book's own update time (captured_at), our fetch time
          # (collected_at) and the SHA-256 of the provider response. If the store can't be reached, lines are NOT fetched
          # (no credits spent on data that couldn't be kept) and the board shows no lines for that refresh.
          # Every call's remaining credits go to preview-ledger/odds_api_usage.jsonl (no key, no URL, no odds);
          # a call is skipped when fewer than 15 credits are left this month (forward-only: nothing is back-filled).
          for lg in nba nfl; do
            [ "$( [ $lg = nba ] && echo $NBA_OK || echo $NFL_OK)" = 1 ] || { echo "$lg lines skipped: $lg data not ready"; continue; }
            mkdir -p data/processed/$lg
            if [ "${ODDS_STORE:-off}" = on ] && python -m modelroom odds-store load --league $lg > /tmp/odds_load_$lg.json; then
              python3 -c "import json; d=json.load(open('/tmp/odds_load_$lg.json')); v=d['verify']; print('$lg snapshots loaded from the store:', d['rows'], '| chain ok:', v['ok'], '| store bytes read:', d['bytes_read']['bytes'])"
              python3 -c "import json; v=json.load(open('/tmp/odds_load_$lg.json'))['verify']; v['ok'] or print('::warning::$lg odds.snapshots integrity check failed:', '; '.join(v['problems']))"
              if [ -n "${ODDS_API_KEY:-}" ] && echo "$KINDS" | grep -Eq "morning|midday|workflow_dispatch"; then
                if python -m modelroom $lg odds; then
                  python -m modelroom odds-store sync --league $lg --batch "collection" > /tmp/odds_sync_$lg.json \
                    && python3 -c "import json; d=json.load(open('/tmp/odds_sync_$lg.json')); print('$lg stored:', d['inserted'], 'new rows | chain ok:', d['verify']['ok'], '| rows:', d['verify']['rows'], '| store bytes read:', d['bytes_read']['bytes'])" \
                    || echo "::warning::$lg new lines could not be written to the store"
                else
                  echo "::warning::$lg lines not fetched; continuing without them"
                fi
              fi
            else
              echo "::warning::sportsbook snapshot store not reachable: $lg lines not loaded or fetched this refresh"
            fi
          done
          run nba python -m modelroom nba project
          run nfl python -m modelroom nfl project
          run nfl python -m modelroom nfl props
          run nba python -m modelroom nba props
          python -m modelroom ledger verify
          # Results history for each league whose data passed (a delayed league keeps its last history until it does).
          python -m modelroom history --league "$( { [ $NFL_OK = 1 ] && echo nfl; [ $NBA_OK = 1 ] && echo nba; } | paste -sd, -)"
          # NBA Pick of the Day (TEST, NBA player props only): one decision per Pacific date from the active NBA props
          # model; nothing is recorded without an approved line source; never fails the refresh.
          if [ $NBA_OK = 1 ]; then python -m modelroom potd --league nba > /tmp/potd.json || echo "::warning::Pick of the Day not built"; python3 -c "import json; d=json.load(open('/tmp/potd.json')); print('potd:', json.dumps({k: d.get(k) for k in ('new', 'graded', 'today', 'context')}))" 2>/dev/null || true; fi
          run nba python -m modelroom nba props-monitor
          run nfl python -m modelroom nfl props-monitor
          run nba python -m modelroom nba props-shadow || echo "::warning::NBA shadow report failed; predictions are still recorded"
          # Historical sportsbook analysis (read-only toward models, probabilities, grading and every existing record):
          # matches each stored line to the latest game prediction recorded BEFORE it, appends the comparisons and a
          # detailed report to the private append-only tables odds.comparisons / odds.reports, and writes aggregate
          # counts only to preview-ledger/reports/sportsbook_<lg>.json. No Odds API calls. A failure never fails the refresh.
          if [ "${ODDS_STORE:-off}" = on ]; then
            for lg in nba nfl; do
              [ "$( [ $lg = nba ] && echo $NBA_OK || echo $NFL_OK)" = 1 ] || continue
              python -m modelroom markets sportsbook $lg > /tmp/sb_$lg.json \
                && python3 -c "import json; d=json.load(open('/tmp/sb_$lg.json')); print('$lg sportsbook analysis:', ('SKIPPED (' + d['skipped'] + ')') if d.get('skipped') else '', d['comparisons'], 'comparisons,', d['new_comparisons'], 'new | chains ok:', d['snapshots_chain_ok'], d['comparisons_chain_ok'], d['reports_chain_ok'], '| store bytes read:', d.get('bytes_read', {}).get('bytes'))" \
                || echo "::warning::$lg sportsbook analysis failed; nothing else is affected"
            done
          fi
          # Market-settled grading. Exchange providers are never switched on here (public repo, provider
          # terms), so this publishes an empty record with the reason; it fills in where prices are enabled.
          run nfl python -m modelroom markets settle nfl
          run nba python -m modelroom markets settle nba

      - name: Keep the last good projections if anything failed
        if: steps.data.outcome == 'failure'
        run: git checkout -- modeling/data/published modeling/preview-ledger 2>/dev/null || true

      # Fail closed before anything is committed. Whatever this run is about to publish is scanned for sportsbook
      # names, individual lines or prices, credentials and private database identifiers; a finding fails the job and
      # nothing is pushed. This is a second line of defence: each writer already refuses to produce such a file
      # (modeling/modelroom/privacy.py), and that writer-level check stays exactly as it is.
      - name: Privacy scan of everything about to be published
        if: always()
        working-directory: modeling
        run: python3 -m modelroom.privacy scan data/published preview-ledger

      - name: Publish to the preview branch
        env:
          DATA: ${{ steps.data.outcome }}
          SLOTS: ${{ needs.plan.outputs.slots }}
          NBA_OK: ${{ steps.data.outputs.nba_ok }}
          NFL_OK: ${{ steps.data.outputs.nfl_ok }}
          NFL_WHY: ${{ steps.data.outputs.nfl_why }}
          NBA_WHY: ${{ steps.data.outputs.nba_why }}
        run: |
          # Every attempt is logged (append-only), success or failure, with the slots it covered.
          if [ "$DATA" = "success" ]; then ST=success; elif [ "$DATA" = "skipped" ]; then ST=skipped; else ST=failed; fi
          NOTE="${{ github.event.inputs.trigger || github.event_name }} run ${{ github.run_id }}"
          ALL="${SLOTS:-manual:$(date -u +%Y-%m-%dT%H:%MZ)}"
          if [ "$ST" = "success" ] && { [ "$NBA_OK" = 0 ] || [ "$NFL_OK" = 0 ]; }; then
            # One league's data wasn't ready: its own slots (and the shared ones) stay failed so the planner retries them
            # as before; the other league's slots are done. The delay is logged separately in the note.
            BAD=$([ "$NFL_OK" = 0 ] && echo nfl || echo nba); WHY=$([ "$BAD" = nfl ] && echo "$NFL_WHY" || echo "$NBA_WHY")
            # league slots look like pregame:nba:<time> / inactives:nfl:<time>; morning, midday, afternoon and manual cover both
            GOOD=$(python3 -c "import sys; print(','.join(x for x in sys.argv[1].split(',') if x.count(':') >= 2 and x.split(':')[1] in ('nba','nfl') and x.split(':')[1] != sys.argv[2]))" "$ALL" "$BAD")
            REST=$(python3 -c "import sys; print(','.join(x for x in sys.argv[1].split(',') if x and not (x.count(':') >= 2 and x.split(':')[1] in ('nba','nfl') and x.split(':')[1] != sys.argv[2])))" "$ALL" "$BAD")
            (cd modeling \
              && { [ -z "$GOOD" ] || python3 modelroom/refresh_plan.py record --slots "$GOOD" --status success --note "$NOTE; ${BAD} data delayed, ${BAD} not rebuilt"; } \
              && { [ -z "$REST" ] || python3 modelroom/refresh_plan.py record --slots "$REST" --status failed --note "$NOTE; ${BAD} data delayed: ${WHY}"; } \
              && python3 modelroom/refresh_plan.py status > data/published/refresh_status.json)
            ST=partial
          else
            [ "$ST" = "skipped" ] || (cd modeling && python3 modelroom/refresh_plan.py record --slots "$ALL" --status $( [ "$ST" = success ] && echo success || echo failed ) --note "$NOTE" \
              && python3 modelroom/refresh_plan.py status > data/published/refresh_status.json)
          fi
          [ "$ST" = "skipped" ] || git add -f modeling/preview-ledger/refresh_log.jsonl modeling/data/published/refresh_status.json
          if [ "$DATA" = "success" ]; then
            git add -f modeling/data/published/nba.json modeling/data/published/nfl.json \
                       modeling/data/published/nfl_props.json modeling/data/published/nba_props.json \
                       modeling/data/published/performance_nfl.json modeling/data/published/performance_nba.json \
                       modeling/data/published/market_results_nfl.json modeling/data/published/market_results_nba.json \
                       modeling/data/published/props_monitor_nba.json modeling/data/published/props_monitor_nfl.json \
                       modeling/data/published/injuries_live_nba.json modeling/data/published/injuries_live_nfl.json \
                       $( [ -f modeling/data/published/pick_of_the_day.json ] && echo modeling/data/published/pick_of_the_day.json ) \
                       $( [ -f modeling/data/published/nba_player_logs.json ] && echo modeling/data/published/nba_player_logs.json ) \
                       $( [ -f modeling/data/published/nba_props_shadow_0.2.3c.json ] && echo modeling/data/published/nba_props_shadow_0.2.3c.json ) \
                       modeling/data/published/history modeling/preview-ledger
          fi
          git commit -m "Preview data refresh $(date -u +%Y-%m-%dT%H:%MZ) [$ST]" || echo "No data changes"
          git push origin preview

      # When the next slot opens, from the refresh log this run just wrote. A slot that failed is still due, so the
      # planner asks for a retry in 10 minutes while its window is open.
      - name: Tell the scheduler when to wake next
        if: always()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/scheduler-next.sh

      - name: Report a data failure
        if: steps.data.outcome == 'failure'
        run: |
          echo "::error::Projections were not regenerated (see 'Download, validate and project'). The site kept the previous ones."
          exit 1
