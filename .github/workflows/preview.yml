# Continuous deployment of the public test site (the `preview` branch on Vercel).
#
#   push to main      → main is merged into `preview` within about a minute; Vercel rebuilds the test site.
#                       If the push changed modeling/ (engines, params), projections are regenerated first.
#   twice a day       → fresh data: download, validate, run every engine, publish.
#   "Run workflow"    → same as the scheduled run (GitHub app: Actions → Preview → Run workflow).
#
# Only `preview` is ever pushed to. main is never modified, and production is not deployed from here.
# No exchange prices are fetched: this repository is public, and Polymarket US / Kalshi terms don't
# allow republishing their data. No secrets are used.
name: Preview

on:
  push:
    branches: [main]
  schedule:
    # A cheap check every 10 minutes; the deploy job runs only when a refresh slot is due (see
    # modeling/modelroom/refresh_plan.py): 7:00 AM, 12:00 PM and 4:00 PM PT, NFL kickoff − 90 min (inactive lists),
    # and 30 min before every game. GitHub can start scheduled runs late; each slot stays open for a window
    # so a late start still refreshes, and a slot that succeeded is never run twice.
    # Backup trigger. The primary trigger is Supabase pg_cron, which dispatches this workflow every 5 minutes
    # with mode=plan (supabase/migrations/20261104000100_refresh_scheduler.sql): it starts on time, unlike
    # GitHub's schedule. Both go through the same planner, so a slot runs once whichever arrives first.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "force = refresh now; plan = refresh only if a slot is due (what the scheduler sends)"
        required: false
        default: force
        type: choice
        options: [force, plan]
      trigger:
        description: "who started the run (logged)"
        required: false
        default: manual
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
      slots: ${{ steps.due.outputs.slots }}
      kinds: ${{ steps.due.outputs.kinds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
          sparse-checkout: |
            modeling/modelroom/refresh_plan.py
            modeling/modelroom/__init__.py
            modeling/preview-ledger/refresh_log.jsonl
            modeling/data/published/nba.json
            modeling/data/published/nfl.json
      - name: Is a refresh due?
        id: due
        working-directory: modeling
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$MODE" = "plan" ]; then
            python3 modelroom/refresh_plan.py due
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "slots=" >> "$GITHUB_OUTPUT"; echo "kinds=$EVENT" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    if: needs.plan.outputs.run == 'yes'
    concurrency:
      group: preview
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODELROOM_LEDGER_DIR: ${{ github.workspace }}/modeling/preview-ledger
      # NBA player props: the 0.2.0 model on the TEST SITE only (approved 2026-11-03). Every prediction it
      # makes is recorded in the ledger as 0.2.0; earlier 0.1.0 records stay exactly as they were.
      # Rollback: delete this line (or set "0.1.0") and push; the next refresh publishes 0.1.0 again.
      MODELROOM_NBA_PROPS_VERSION: "0.2.0"
      # Injury-feed versions on the TEST SITE only. The previous versions keep running in the ledger as shadows
      # (recorded, not published) so both are graded on the same games. Rollback: set the versions back to
      # 0.2.0 / 0.1.0 (and MODELROOM_NBA_INJURY_FEED: "off" for the NBA game engine's injury adjustment).
      # NBA shadow evaluation (approved 2026-11-07, 2-3 weeks): 0.2.3a (primary) and 0.2.3 (secondary) are run on the
      # same games and the same pregame information as the active 0.2.0 and recorded in the ledger; nothing they
      # produce is published. 0.2.1's earlier shadow records stay in the ledger as they were. Graded daily by
      # `nba props-shadow` → preview-ledger/reports/nba_props_shadow.json. Rollback: set back to "0.2.1" (or "").
      MODELROOM_NBA_PROPS_SHADOW: "0.2.3a,0.2.3"
      MODELROOM_NFL_PROPS_VERSION: "0.1.1"
      # NFL shadow test (approved 2026-11-09): 0.1.3 = 0.1.1 + RB-carry / TE-target concentration within each team's
      # position group (team totals unchanged). Recorded in the ledger next to 0.1.1 on the same games and inputs, never
      # published; 0.1.3 can't be made the active version (pipeline refuses). Rollback: remove ",0.1.3".
      MODELROOM_NFL_PROPS_SHADOW: "0.1.0,0.1.3"
      MODELROOM_NBA_INJURY_FEED: "on"
      # NFL coming games: the projected starter (injury report + live depth chart) instead of the schedule field,
      # which only repeats last week's starter. Finished games keep the actual starter. Rollback: "listed".
      MODELROOM_NFL_QB_SOURCE: "live"
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bring main into the preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin preview >/dev/null; then
            git fetch origin preview
            git checkout -B preview origin/preview
            git merge --no-edit origin/main
          else
            git checkout -B preview
          fi

      - name: Decide whether to regenerate projections
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          SLOTS: ${{ needs.plan.outputs.slots }}
        run: |
          # Duplicate-run protection: runs queue on the "preview" concurrency group, so by the time this one starts
          # an earlier run may already have done the same slots. Re-check against the latest refresh log.
          if [ -n "$SLOTS" ]; then
            left=$(cd modeling && python3 modelroom/refresh_plan.py pending --slots "$SLOTS" | python3 -c "import sys,json;print(','.join(json.load(sys.stdin)['pending']))")
            if [ -z "$left" ]; then echo "data=no" >> "$GITHUB_OUTPUT"; echo "Slots already done by an earlier run: $SLOTS"; exit 0; fi
          fi
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$SHA" | grep -q '^modeling/'; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          else
            echo "data=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.data == 'yes'
        with:
          python-version: "3.12"

      - name: Connect to the sportsbook snapshot store (TEST Supabase; nothing printed)
        if: steps.plan.outputs.data == 'yes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/odds-store-connect.sh

      - name: Download, validate and project
        id: data
        if: steps.plan.outputs.data == 'yes'
        continue-on-error: true
        working-directory: modeling
        env:
          KINDS: ${{ needs.plan.outputs.kinds }}
        run: |
          pip install -e . "psycopg[binary]"
          python -m modelroom nba ingest
          python -m modelroom nfl ingest
          python -m modelroom sources validate
          # Injury feed (test site): the official NBA injury report + ESPN's injury reports (+ nflverse's copy of the
          # NFL report). A failed source is logged on the site; the engines then fall back to their own
          # availability rules. Then the NFL starters are rebuilt with the live depth chart and designations.
          python -m modelroom injuries nba || echo "::warning::NBA injury feed failed; NBA engines use the missed-games rule"
          python -m modelroom injuries nfl || echo "::warning::NFL injury feed failed; NFL engines use nflverse injury reports"
          python -m modelroom nfl starters > /dev/null
          # Sportsbook lines (DraftKings, FanDuel and other US books) from The Odds API, only when the
          # ODDS_API_KEY secret is set. Free tier = 500 credits a month; each league costs 3 credits a call, so
          # lines are fetched only at the 7:00 AM and 12:00 PM PT refreshes (and manual runs): about 360 a month.
          # The 4:00 PM injury refresh reuses the midday prices (a third fetch would exceed the free 500).
          # Snapshots are kept in the append-only Supabase table odds.snapshots, NOT in this public repository (The Odds
          # API's terms allow storing and displaying the data, not offering it as downloadable files). Each refresh rebuilds
          # the working copy from the table, fetches (7 AM / noon only), and appends new rows; nothing is ever updated.
          # Each row keeps the book, market, line, prices, the book's own update time (captured_at), our fetch time
          # (collected_at) and the SHA-256 of the provider response. If the store can't be reached, lines are NOT fetched
          # (no credits spent on data that couldn't be kept) and the board shows no lines for that refresh.
          # Every call's remaining credits go to preview-ledger/odds_api_usage.jsonl (no key, no URL, no odds);
          # a call is skipped when fewer than 15 credits are left this month (forward-only: nothing is back-filled).
          for lg in nba nfl; do
            mkdir -p data/processed/$lg
            if [ "${ODDS_STORE:-off}" = on ] && python -m modelroom odds-store load --league $lg > /tmp/odds_load_$lg.json; then
              python3 -c "import json; d=json.load(open('/tmp/odds_load_$lg.json')); print('$lg snapshots loaded from the store:', d['rows'])"
              if [ -n "${ODDS_API_KEY:-}" ] && echo "$KINDS" | grep -Eq "morning|midday|workflow_dispatch"; then
                if python -m modelroom $lg odds; then
                  python -m modelroom odds-store sync --league $lg --batch "collection" > /tmp/odds_sync_$lg.json \
                    && python3 -c "import json; d=json.load(open('/tmp/odds_sync_$lg.json')); print('$lg stored:', d['inserted'], 'new rows | chain ok:', d['verify']['ok'], '| rows:', d['verify']['rows'])" \
                    || echo "::warning::$lg new lines could not be written to the store"
                else
                  echo "::warning::$lg lines not fetched; continuing without them"
                fi
              fi
            else
              echo "::warning::sportsbook snapshot store not reachable: $lg lines not loaded or fetched this refresh"
            fi
          done
          python -m modelroom nba project
          python -m modelroom nfl project
          python -m modelroom nfl props
          python -m modelroom nba props
          python -m modelroom ledger verify
          python -m modelroom history
          python -m modelroom nba props-monitor
          python -m modelroom nfl props-monitor
          python -m modelroom nba props-shadow || echo "::warning::NBA shadow report failed; predictions are still recorded"
          # Market-settled grading. Exchange providers are never switched on here (public repo, provider
          # terms), so this publishes an empty record with the reason; it fills in where prices are enabled.
          python -m modelroom markets settle nfl
          python -m modelroom markets settle nba

      - name: Keep the last good projections if anything failed
        if: steps.data.outcome == 'failure'
        run: git checkout -- modeling/data/published modeling/preview-ledger 2>/dev/null || true

      - name: Publish to the preview branch
        env:
          DATA: ${{ steps.data.outcome }}
          SLOTS: ${{ needs.plan.outputs.slots }}
        run: |
          # Every attempt is logged (append-only), success or failure, with the slots it covered.
          if [ "$DATA" = "success" ]; then ST=success; elif [ "$DATA" = "skipped" ]; then ST=skipped; else ST=failed; fi
          [ "$ST" = "skipped" ] || (cd modeling && python3 modelroom/refresh_plan.py record --slots "${SLOTS:-manual:$(date -u +%Y-%m-%dT%H:%MZ)}" --status $ST --note "${{ github.event.inputs.trigger || github.event_name }} run ${{ github.run_id }}" \
            && python3 modelroom/refresh_plan.py status > data/published/refresh_status.json)
          [ "$ST" = "skipped" ] || git add -f modeling/preview-ledger/refresh_log.jsonl modeling/data/published/refresh_status.json
          if [ "$DATA" = "success" ]; then
            git add -f modeling/data/published/nba.json modeling/data/published/nfl.json \
                       modeling/data/published/nfl_props.json modeling/data/published/nba_props.json \
                       modeling/data/published/performance_nfl.json modeling/data/published/performance_nba.json \
                       modeling/data/published/market_results_nfl.json modeling/data/published/market_results_nba.json \
                       modeling/data/published/props_monitor_nba.json modeling/data/published/props_monitor_nfl.json \
                       modeling/data/published/injuries_live_nba.json modeling/data/published/injuries_live_nfl.json \
                       modeling/data/published/history modeling/preview-ledger
          fi
          git commit -m "Preview data refresh $(date -u +%Y-%m-%dT%H:%MZ) [$ST]" || echo "No data changes"
          git push origin preview

      - name: Report a data failure
        if: steps.data.outcome == 'failure'
        run: |
          echo "::error::Projections were not regenerated (see 'Download, validate and project'). The site kept the previous ones."
          exit 1
