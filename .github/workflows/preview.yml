# Continuous deployment of the public test site (the `preview` branch on Vercel).
#
#   push to main      → main is merged into `preview` within about a minute; Vercel rebuilds the test site.
#                       If the push changed modeling/ (engines, params), projections are regenerated first.
#   twice a day       → fresh data: download, validate, run every engine, publish.
#   "Run workflow"    → same as the scheduled run (GitHub app: Actions → Preview → Run workflow).
#
# Only `preview` is ever pushed to. main is never modified, and production is not deployed from here.
# No exchange prices are fetched: this repository is public, and Polymarket US / Kalshi terms don't
# allow republishing their data. No secrets are used.
name: Preview

on:
  push:
    branches: [main]
  schedule:
    # A cheap check every 10 minutes; the deploy job runs only when a refresh slot is due (see
    # modeling/modelroom/refresh_plan.py): 7:00 AM PT, 12:00 PM PT, NFL kickoff − 90 min (inactive lists),
    # and 30 min before every game. GitHub can start scheduled runs late; each slot stays open for a window
    # so a late start still refreshes, and a slot that succeeded is never run twice.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
      slots: ${{ steps.due.outputs.slots }}
      kinds: ${{ steps.due.outputs.kinds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
          sparse-checkout: |
            modeling/modelroom/refresh_plan.py
            modeling/modelroom/__init__.py
            modeling/preview-ledger/refresh_log.jsonl
            modeling/data/published/nba.json
            modeling/data/published/nfl.json
      - name: Is a refresh due?
        id: due
        working-directory: modeling
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python3 modelroom/refresh_plan.py due
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "slots=" >> "$GITHUB_OUTPUT"; echo "kinds=$EVENT" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    if: needs.plan.outputs.run == 'yes'
    concurrency:
      group: preview
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODELROOM_LEDGER_DIR: ${{ github.workspace }}/modeling/preview-ledger
      # NBA player props: the 0.2.0 model on the TEST SITE only (approved 2026-11-03). Every prediction it
      # makes is recorded in the ledger as 0.2.0; earlier 0.1.0 records stay exactly as they were.
      # Rollback: delete this line (or set "0.1.0") and push; the next refresh publishes 0.1.0 again.
      MODELROOM_NBA_PROPS_VERSION: "0.2.0"
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bring main into the preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin preview >/dev/null; then
            git fetch origin preview
            git checkout -B preview origin/preview
            git merge --no-edit origin/main
          else
            git checkout -B preview
          fi

      - name: Decide whether to regenerate projections
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$SHA" | grep -q '^modeling/'; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          else
            echo "data=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.data == 'yes'
        with:
          python-version: "3.12"

      - name: Download, validate and project
        id: data
        if: steps.plan.outputs.data == 'yes'
        continue-on-error: true
        working-directory: modeling
        env:
          KINDS: ${{ needs.plan.outputs.kinds }}
        run: |
          pip install -e .
          python -m modelroom nba ingest
          python -m modelroom nfl ingest
          python -m modelroom sources validate
          # Sportsbook lines (DraftKings, FanDuel and other US books) from The Odds API, only when the
          # ODDS_API_KEY secret is set. Free tier = 500 credits a month; each league costs 3 credits a call, so
          # lines are fetched only at the 7:00 AM and 12:00 PM PT refreshes (and manual runs): about 360 a month.
          # Snapshots are kept on the preview branch (append-only) so past games keep the line they had.
          for lg in nba nfl; do
            mkdir -p data/processed/$lg
            [ -f preview-ledger/market_snapshots_$lg.parquet ] && cp preview-ledger/market_snapshots_$lg.parquet data/processed/$lg/market_snapshots.parquet
            if [ -n "${ODDS_API_KEY:-}" ] && echo "$KINDS" | grep -Eq "morning|midday|workflow_dispatch"; then
              python -m modelroom $lg odds || echo "::warning::$lg lines not fetched; continuing without them"
            fi
            [ -f data/processed/$lg/market_snapshots.parquet ] && cp data/processed/$lg/market_snapshots.parquet preview-ledger/market_snapshots_$lg.parquet
          done
          python -m modelroom nba project
          python -m modelroom nfl project
          python -m modelroom nfl props
          python -m modelroom nba props
          python -m modelroom ledger verify
          python -m modelroom history
          python -m modelroom nba props-monitor
          python -m modelroom nfl props-monitor
          # Market-settled grading. Exchange providers are never switched on here (public repo, provider
          # terms), so this publishes an empty record with the reason; it fills in where prices are enabled.
          python -m modelroom markets settle nfl
          python -m modelroom markets settle nba

      - name: Keep the last good projections if anything failed
        if: steps.data.outcome == 'failure'
        run: git checkout -- modeling/data/published modeling/preview-ledger 2>/dev/null || true

      - name: Publish to the preview branch
        env:
          DATA: ${{ steps.data.outcome }}
          SLOTS: ${{ needs.plan.outputs.slots }}
        run: |
          # Every attempt is logged (append-only), success or failure, with the slots it covered.
          if [ "$DATA" = "success" ]; then ST=success; elif [ "$DATA" = "skipped" ]; then ST=skipped; else ST=failed; fi
          [ "$ST" = "skipped" ] || (cd modeling && python3 modelroom/refresh_plan.py record --slots "${SLOTS:-manual:$(date -u +%Y-%m-%dT%H:%MZ)}" --status $ST --note "${{ github.event_name }} run ${{ github.run_id }}" \
            && python3 modelroom/refresh_plan.py status > data/published/refresh_status.json)
          [ "$ST" = "skipped" ] || git add -f modeling/preview-ledger/refresh_log.jsonl modeling/data/published/refresh_status.json
          if [ "$DATA" = "success" ]; then
            git add -f modeling/data/published/nba.json modeling/data/published/nfl.json \
                       modeling/data/published/nfl_props.json modeling/data/published/nba_props.json \
                       modeling/data/published/performance_nfl.json modeling/data/published/performance_nba.json \
                       modeling/data/published/market_results_nfl.json modeling/data/published/market_results_nba.json \
                       modeling/data/published/props_monitor_nba.json modeling/data/published/props_monitor_nfl.json \
                       modeling/data/published/history modeling/preview-ledger
          fi
          git commit -m "Preview data refresh $(date -u +%Y-%m-%dT%H:%MZ) [$ST]" || echo "No data changes"
          git push origin preview

      - name: Report a data failure
        if: steps.data.outcome == 'failure'
        run: |
          echo "::error::Projections were not regenerated (see 'Download, validate and project'). The site kept the previous ones."
          exit 1
