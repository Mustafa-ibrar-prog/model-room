# Live check of the Polymarket US integration, run by hand (Actions → Verify market integrations → Run
# workflow). Runs in a throwaway runner: data is fetched, checked and discarded. Nothing is committed,
# uploaded or published; the log carries counts and pass/fail only.
#
# KALSHI IS PAUSED HERE: it is never contacted from GitHub until Kalshi confirms in writing that
# fetch-and-discard testing on hosted runners is allowed. Check Kalshi on your own computer with
# scripts/verify-markets-local.ps1 (or .sh). modelroom.markets.verify refuses Kalshi in CI on its own.
name: Verify market integrations (Polymarket only; Kalshi local)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODELROOM_LEDGER_DIR: ${{ github.workspace }}/throwaway-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download data and build the projections (no exchange data)
        working-directory: modeling
        run: |
          pip install -e . -q
          python -m modelroom nba ingest > /dev/null
          python -m modelroom nfl ingest > /dev/null
          python -m modelroom nba project > /dev/null
          python -m modelroom nfl project > /dev/null
      - name: Verify NFL markets
        working-directory: modeling
        run: python -m modelroom.markets.verify nfl
      - name: Verify NBA markets
        if: always()
        working-directory: modeling
        run: python -m modelroom.markets.verify nba
