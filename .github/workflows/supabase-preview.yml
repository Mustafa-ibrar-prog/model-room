# Sets up the TEST SITE's Supabase project: applies the database migrations and creates the three test
# accounts with their plans (no payments). Run it from the GitHub app: Actions → Supabase (test site) →
# Run workflow. It also runs when a migration changes. Uses repository secrets only; nothing is printed.
name: Supabase (test site)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "scripts/seed-test-accounts.mjs", "scripts/verify-supabase.mjs", ".github/workflows/supabase-preview.yml"]

permissions:
  contents: read

concurrency:
  group: supabase-preview
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
      MODELROOM_TARGET: preview
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$TEST_ACCOUNT_PASSWORD" ]; then
            echo "::warning::Supabase secrets aren't set yet (see docs/preview-deploy.md). Nothing to do."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'yes'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: 22
      - name: Install
        if: steps.check.outputs.ready == 'yes'
        run: npm ci --ignore-scripts
      - name: Check keys, project URL and Auth (prints no secrets)
        if: steps.check.outputs.ready == 'yes'
        run: node scripts/verify-supabase.mjs preflight
      - name: Check the database connection
        if: steps.check.outputs.ready == 'yes'
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*) echo "ok    using the connection pooler (works from GitHub's IPv4 runners)";;
            *db.*.supabase.co*) echo "::warning::Direct connection (db.<ref>.supabase.co) is IPv6-only and may fail here. Use the Session pooler string from Supabase → Connect.";;
          esac
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -qtAc "select 'ok    database reachable, Postgres ' || current_setting('server_version')"
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'yes'
        with:
          version: latest
      - name: Apply database migrations
        if: steps.check.outputs.ready == 'yes'
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
          supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Create the test accounts
        if: steps.check.outputs.ready == 'yes'
        run: node scripts/seed-test-accounts.mjs
      - name: Check the test accounts sign in with the right plans
        if: steps.check.outputs.ready == 'yes'
        run: node scripts/verify-supabase.mjs accounts
      - name: Check row-level security
        if: steps.check.outputs.ready == 'yes'
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -qtA <<'SQL'
          do $$
          declare uid uuid; others int; own int; rls_off int;
          begin
            select count(*) into rls_off from pg_tables where schemaname = 'public' and not rowsecurity;
            if rls_off > 0 then raise exception 'FAIL  % public table(s) have row-level security off', rls_off; end if;
            select id into uid from auth.users where email = 'free-test@modelroom.test';
            perform set_config('request.jwt.claims', json_build_object('sub', uid, 'role', 'authenticated')::text, true);
            set local role authenticated;
            select count(*) into others from public.memberships where user_id <> uid;
            select count(*) into own from public.memberships where user_id = uid;
            reset role;
            if others > 0 then raise exception 'FAIL  a signed-in user can read % other membership row(s)', others; end if;
            raise notice 'ok    every public table has row-level security on; a signed-in user sees only their own memberships (% own rows)', own;
            perform set_config('request.jwt.claims', null, true);
            set local role anon;
            select count(*) into others from public.memberships;
            reset role;
            if others > 0 then raise exception 'FAIL  anonymous visitors can read memberships'; end if;
            raise notice 'ok    anonymous visitors can read no memberships';
          end $$;
          SQL
