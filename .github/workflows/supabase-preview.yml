# Sets up the TEST SITE's Supabase project: applies the database migrations and creates the three test
# accounts with their plans (no payments). Run it from the GitHub app: Actions → Supabase (test site) →
# Run workflow. It also runs when a migration changes. Uses repository secrets only; nothing is printed.
name: Supabase (test site)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "scripts/seed-test-accounts.mjs", "scripts/verify-supabase.mjs", ".github/workflows/supabase-preview.yml"]

permissions:
  contents: read

concurrency:
  group: supabase-preview
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
      MODELROOM_TARGET: preview
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$TEST_ACCOUNT_PASSWORD" ]; then
            echo "::warning::Supabase secrets aren't set yet (see docs/preview-deploy.md). Nothing to do."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'yes'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: 22
      - name: Install
        if: steps.check.outputs.ready == 'yes'
        run: npm ci --ignore-scripts
      - name: Check keys, project URL and Auth (prints no secrets)
        if: steps.check.outputs.ready == 'yes'
        run: node scripts/verify-supabase.mjs preflight
      - name: Check the database connection
        if: steps.check.outputs.ready == 'yes'
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          try() { PGCONNECT_TIMEOUT=8 psql "$1" -qtAc "select 1" >/dev/null 2>&1; }
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*)
              try "$SUPABASE_DB_URL" || { echo "FAIL  can't connect with SUPABASE_DB_URL (check the password in the string)"; exit 1; }
              echo "ok    database reachable through the connection pooler"
              echo "DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV";;
            *db.*.supabase.co*)
              echo "::warning::SUPABASE_DB_URL is the direct connection (db.<ref>.supabase.co), which is IPv6-only and unreachable from GitHub. Trying the Session pooler for the same project instead. To skip this, replace the secret with the Session pooler string from Supabase → Connect."
              found=""
              for host in aws-0-us-east-1 aws-1-us-east-1 aws-0-us-east-2 aws-1-us-east-2 aws-0-us-west-1 aws-1-us-west-1 aws-0-us-west-2 aws-1-us-west-2 aws-0-ca-central-1 aws-1-ca-central-1 aws-0-eu-west-1 aws-1-eu-west-1 aws-0-eu-west-2 aws-1-eu-west-2 aws-0-eu-central-1 aws-1-eu-central-1 aws-0-ap-southeast-1 aws-1-ap-southeast-1 aws-0-ap-southeast-2 aws-1-ap-southeast-2 aws-0-ap-northeast-1 aws-1-ap-northeast-1 aws-0-ap-south-1 aws-1-ap-south-1 aws-0-sa-east-1 aws-1-sa-east-1; do
                urls=$(HOST="$host.pooler.supabase.com" python3 scripts/pooler-url.py 2>/tmp/note) || { cat /tmp/note; exit 1; }
                [ "$host" = aws-0-us-east-1 ] && cat /tmp/note
                while IFS= read -r url; do
                  echo "::add-mask::$url"
                  err=$(PGCONNECT_TIMEOUT=8 psql "$url" -qtAc "select 1" 2>&1 >/dev/null) && { found="$url"; break; }
                  case "$err" in *"password authentication failed"*) badpw=1;; esac
                done <<< "$urls"
                if [ -n "$found" ]; then echo "ok    reached the database through the Session pooler ($host)"; break; fi
              done
              [ -n "$found" ] || [ -z "${badpw:-}" ] || { echo "FAIL  found the project's pooler, but the database password in SUPABASE_DB_URL is wrong. Reset it in Supabase → Project Settings → Database and update the secret."; exit 1; }
              [ -n "$found" ] || { echo "FAIL  couldn't reach the database through any Session pooler. Replace SUPABASE_DB_URL with the Session pooler string from Supabase → Connect."; exit 1; }
              echo "DB_URL=$found" >> "$GITHUB_ENV";;
            *)
              try "$SUPABASE_DB_URL" || { echo "FAIL  can't connect with SUPABASE_DB_URL"; exit 1; }
              echo "DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV";;
          esac
          psql "$(grep '^DB_URL=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" -qtAc "select 'ok    Postgres ' || current_setting('server_version')"
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'yes'
        with:
          version: latest
      - name: Apply database migrations
        if: steps.check.outputs.ready == 'yes'
        run: |
          supabase db push --db-url "$DB_URL" --include-all --yes
          supabase migration list --db-url "$DB_URL"
      - name: Switch on test-account plan switching for this (test site) database
        if: steps.check.outputs.ready == 'yes'
        # Only this workflow sets it, and it only ever targets the test site's project. A production
        # database never has the flag, so public.test_simulate_membership() refuses there.
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -qtAc "insert into private.app_settings (key, value) values ('test_account_controls', 'on') on conflict (key) do update set value = excluded.value"
      - name: Switch on the refresh scheduler for this (test site) database
        if: steps.check.outputs.ready == 'yes'
        # pg_cron dispatches the Preview workflow every 5 minutes (see the 20261104000100 migration). It needs
        # the GitHub token in Supabase Vault, stored by the owner from the SQL editor; it is never in GitHub
        # or this repository. Without the token it logs "no token" hourly and does nothing.
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -qtAc "insert into private.app_settings (key, value) values ('refresh_scheduler', 'on') on conflict (key) do update set value = excluded.value"
      - name: Report the refresh scheduler's health (no secrets)
        if: steps.check.outputs.ready == 'yes'
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -qtAc "select 'scheduler - enabled=' || enabled || ', token stored=' || (exists (select 1 from vault.secrets where name = 'model_room_github_dispatch'))::text || ', last accepted dispatch=' || coalesce(last_accepted::text, 'never') || ', failures 24h=' || failures_24h from scheduler.health"
      - name: Create the test accounts
        if: steps.check.outputs.ready == 'yes'
        run: node scripts/seed-test-accounts.mjs
      - name: Check the test accounts sign in with the right plans
        if: steps.check.outputs.ready == 'yes'
        run: node scripts/verify-supabase.mjs accounts
      - name: Check row-level security and privileges
        if: steps.check.outputs.ready == 'yes'
        # Read-only (rolled back). Fails if RLS is off anywhere, anon has any access to account tables,
        # signed-in users can write plans, or a signed-in user can see anyone else's membership.
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -qtA -f scripts/check-rls.sql
