name: Polymarket probe (one-off)
on:
  push:
    branches: [polymarket-probe]
    paths: [probe/probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f probe/out4 && git commit -m "Probe output" && git push origin HEAD:polymarket-probe
