name: Archive to R2 (test site)

# Manual only. Copies CLOSED history into the private Cloudflare R2 bucket and verifies it (Moose, 2026-11-23):
#   odds.reports / comparisons / snapshots (closed seq segments), closed weekly prediction ledgers from the preview
#   branch, and (optional) closed days of the Pick of the Day audit table.
# Copies only: nothing in Supabase or Git is changed or deleted. "dryrun" writes under dryrun/ in the bucket.
# Prints counts, ranges, checksums and problems; never payloads, lines, prices or secrets.
# Supabase egress: each archived row is read once, ever (the first full run reads ~0.5 GB, mostly odds.reports);
# later runs read only new closed segments.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (bucket access + privacy probe only), dryrun (under dryrun/), run (v1/), verify (re-check the archive)"
        default: check
        type: choice
        options: [check, dryrun, run, verify]
      supabase:
        description: "also read Supabase (odds tables). OFF = Git ledgers only, zero Supabase egress. Keep off while the project is egress-restricted."
        default: false
        type: boolean
      include_audit:
        description: "also copy closed days of odds.potd_model_outputs"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: archive-r2
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: modeling
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: R2 settings present (names only, never values)
        env:
          R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
        run: |
          miss=""
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_READ_ACCESS_KEY_ID R2_READ_SECRET_ACCESS_KEY; do
            if [ -n "${!k}" ]; then echo "present: $k"; else echo "MISSING: $k"; miss="$miss $k"; fi
          done
          [ -z "$miss" ] || { echo "::error::missing repository secrets:$miss (Settings > Secrets and variables > Actions)"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . "psycopg[binary]" boto3 zstandard
      - name: Bucket access and privacy probe (no Supabase)
        if: github.event.inputs.mode == 'check'
        run: |
          python -m modelroom archive check > /tmp/check.json
          python3 -c "import json; d=json.load(open('/tmp/check.json')); print({k: d[k] for k in ('write','read_back','anonymous_status','private','deleted','ok')})"
          python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/check.json'))['ok'] else 1)" || { echo "::error::bucket access or privacy probe failed"; exit 1; }
      - name: Connect to the store (nothing printed)
        if: github.event.inputs.mode != 'check' && github.event.inputs.supabase == 'true'
        working-directory: .
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/odds-store-connect.sh
      - name: Closed ledgers from the preview branch
        if: github.event.inputs.mode != 'check'
        working-directory: .
        run: |
          git fetch -q origin preview
          mkdir -p /tmp/ledgers && git archive FETCH_HEAD modeling/preview-ledger | tar -x -C /tmp/ledgers
          echo "preview commit: $(git rev-parse FETCH_HEAD)"; ls /tmp/ledgers/modeling/preview-ledger/*.jsonl | wc -l
      - name: Archive and verify
        if: github.event.inputs.mode != 'check'
        run: |
          if [ "${{ github.event.inputs.supabase }}" = true ]; then [ "${ODDS_STORE:-off}" = on ] || { echo "::error::store not reachable"; exit 1; }; nosb=""; else nosb="--no-supabase"; fi
          python -m modelroom archive ${{ github.event.inputs.mode }} $nosb --ledgers /tmp/ledgers/modeling/preview-ledger \
            ${{ github.event.inputs.include_audit == 'true' && '--include-audit' || '' }} > /tmp/archive.json; rc=$?
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/archive.json"))
          print("mode", d["mode"], "| store", d["store"], "| prefix", d["prefix"], "| ok", d["ok"])
          for r in d["odds"]:
              print(f"odds.{r['table']} {r['league']}: db rows {r['db_rows']} chain ok {r['db_chain_ok']} | archived {r.get('archived_rows')} "
                    f"(new segments {r['new_segments']}, kept {r['skipped_existing']}) | tail in Supabase only {r.get('tail_rows_in_supabase_only')}")
              for p in r["problems"]: print("::error::", p)
          for v in d["odds_verify"]:
              print(f"verify odds.{v['table']} {v['league']}: {v['segments']} segments, {v['rows']} rows, ok {v['ok']}")
              for p in v["problems"]: print("::error::", p)
          L = d.get("ledgers") or {}
          if L: print(f"ledgers: {len(L['copied'])} copied, {L['already']} already archived, {len(L['skipped_open'])} open (not copied); "
                      f"{L['files_in_archive']} files, {L['bytes_original']/1e6:.1f} MB -> {L['bytes_stored']/1e6:.1f} MB stored")
          for p in L.get("problems", []): print("::error::", p)
          if d.get("ledgers_verify"): print("verify ledgers:", d["ledgers_verify"]["files"], "files, ok", d["ledgers_verify"]["ok"])
          if d.get("audit"): print("audit days:", d["audit"]["days_closed"], "closed,", len(d["audit"]["copied"]), "copied,", d["audit"]["rows_archived"], "rows archived")
          if d.get("index"): print("archive.objects:", d["index"])
          print("Supabase:", d.get("supabase"), "| bytes read:", d["supabase_bytes_read"]["bytes"], "| rows:", d["supabase_bytes_read"]["rows"])
          PY
          exit $rc
      - name: Independent verification with the READ-ONLY token (size, checksums, git source, chains)
        if: github.event.inputs.mode == 'run' || github.event.inputs.mode == 'verify'
        env:
          R2_READ_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
        run: |
          python -m modelroom.archive.readonly_verify --ledgers /tmp/ledgers/modeling/preview-ledger --prefix v1 > /tmp/r2_manifest_verified.json; rc=$?
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/r2_manifest_verified.json"))
          print(f"read-only verification: {d['files']} files | {d['objects_listed']} objects listed, {d['objects_expected']} expected | unexpected {d['unexpected_objects']} | ok {d['ok']}")
          print(f"bytes original {d['bytes_original']} | stored {d['bytes_stored']} | manifest object {d['manifest_object_bytes']}")
          for r in d["rows"]:
              print("ROW " + json.dumps({k: r[k] for k in ("file", "key", "lines", "chained", "bytes_original", "bytes_stored", "sha256_original", "sha256_stored", "ok")} | {"checks": r["checks"]}))
          for p in d["problems"]: print("::error::", p)
          PY
          exit $rc
      - name: Keep the verified manifest (names, sizes and hashes only; no ledger contents)
        if: always() && (github.event.inputs.mode == 'run' || github.event.inputs.mode == 'verify')
        uses: actions/upload-artifact@v4
        with:
          name: r2-ledger-manifest-verified
          path: /tmp/r2_manifest_verified.json
          if-no-files-found: ignore
          retention-days: 90
